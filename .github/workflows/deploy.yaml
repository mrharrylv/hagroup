name: Build & Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

# One run per bucket at a time, in trigger order. Phase 4 (cleanup.sh)
# deletes every bucket key missing from its own run's keys.txt, so two
# overlapping deploys to one bucket would delete each other's assets and
# pages.
#
# The group is on the whole run, not on the deploy jobs. A job joins a
# job-level group only when it becomes ready, that is when its run's build
# finishes, and GitHub keeps only the newest pending member of a group: if
# two pushes' builds finished out of order, the older commit would deploy
# last. A run joins this group when it is triggered, so runs queue in push
# order. A running run always finishes (cancel-in-progress: false), a newer
# run replaces an older one still pending, and the newest commit always
# deploys last. The cost is that a build waits for the run ahead of it.
#
# Key: a push to main deploys prod; workflow_dispatch deploys its
# `environment` input. Dev and prod runs do not wait for each other.
concurrency:
  group: hagroup-website-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  NODE_VERSION: "20"
  FRONTEND_DIR: services/frontend/it_company

jobs:
  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    # Run under the `prod` Environment so this job can read the VITE_FIREBASE_*
    # secrets stored there (a job without `environment:` can read repository-
    # level secrets only). Firebase web config is public client config and is
    # identical across envs (one Firebase project), so the single shared build
    # artifact is correct for both dev and prod deploys.
    # Caveat: do NOT add required-reviewer protection to `prod`, or every push
    # would gate this build and block the automatic prod deploy.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Type-check
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx tsc -b

      - name: Unit tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm test

      - name: Deploy script tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:deploy

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Check the built pages
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:dist

      - name: Generate S3 key list
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          # The S3 keys this build owns, from the same plan upload.sh follows
          # (prerendered pages map to extensionless keys). Phase 4 deletes
          # every bucket key that is not in this list. Fails on any file type
          # the plan does not know, so nothing ships with a guessed type.
          node scripts/deploy/plan.mjs dist --keys > keys.txt
          echo "S3 keys in this build: $(wc -l < keys.txt | tr -d ' ')"

      # The deploy jobs do not check out the repo: they run the deploy scripts
      # shipped here, so they use exactly the version tested above. Artifacts
      # drop the executable bit, hence `bash <script>` below.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: |
            ${{ env.FRONTEND_DIR }}/dist
            ${{ env.FRONTEND_DIR }}/keys.txt
            ${{ env.FRONTEND_DIR }}/scripts/deploy
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy — DEV  (manual dispatch only)
  # ---------------------------------------------------------------------------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    environment: dev
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: artifact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::561341419749:role/github-oidc-hagroup-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf
        run: |
          BUCKET="dev-hagroup-website"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='dev - hagroup website'].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ] || [ "$DIST_ID" = "null" ]; then
            echo "❌ CloudFront distribution not found. Run the infra workflow first."
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "📦 S3 Bucket: $BUCKET"
          echo "🌐 CloudFront: $DIST_ID"

      # -----------------------------------------------------------------------
      # Zero-Downtime Deploy: additive upload → atomic HTML swap → invalidate → cleanup
      #
      # Phase 1: Upload every non-HTML file (hashed assets, icons, robots,
      #          sitemap, llms). Old and new coexist, no user impact
      # Phase 2: Upload the HTML pages last (they reference the new hashes)
      # Phase 3: Invalidate CloudFront cache and wait for completion
      # Phase 4: Remove objects no longer in the new build's keys.txt
      # -----------------------------------------------------------------------

      - name: "Phase 1 + 2: Upload assets, then HTML pages"
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          # Phase 1 uploads every non-HTML file (additive, no delete); phase 2
          # uploads the prerendered pages only once phase 1 fully succeeded.
          # Keys, Content-Type and Cache-Control come from plan.mjs; see
          # infrastructure/doc.md, "Key mapping".
          bash artifact/scripts/deploy/upload.sh "$BUCKET" artifact/dist

      - name: "Phase 3: Invalidate CloudFront and wait"
        run: |
          DIST_ID="${{ steps.tf.outputs.distribution_id }}"

          echo "🔄 Creating CloudFront invalidation..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "   Invalidation ID: $INVALIDATION_ID"
          echo "⏳ Waiting for invalidation to complete..."

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INVALIDATION_ID"

          echo "✅ Phase 3 complete — CloudFront cache invalidated and propagated"

      - name: "Phase 4: Cleanup orphaned files"
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          # Deletes every bucket key missing from the build's keys.txt.
          # Never deletes index.html, and refuses a key list without it.
          bash artifact/scripts/deploy/cleanup.sh "$BUCKET" artifact/keys.txt

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "✅ DEV deployment complete (zero-downtime)"
          echo "   Bucket : ${{ steps.tf.outputs.bucket }}"
          echo "   CF Dist: ${{ steps.tf.outputs.distribution_id }}"
          echo "   Commit : ${{ github.sha }}"
          echo "=============================================="

  # ---------------------------------------------------------------------------
  # Deploy — PROD  (auto on every push to main, or manual dispatch)
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: prod
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: artifact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::561341419749:role/github-oidc-hagroup-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf
        run: |
          BUCKET="prod-hagroup-website"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='prod - hagroup website'].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ] || [ "$DIST_ID" = "null" ]; then
            echo "❌ CloudFront distribution not found. Run the infra workflow first."
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "📦 S3 Bucket: $BUCKET"
          echo "🌐 CloudFront: $DIST_ID"

      # -----------------------------------------------------------------------
      # Zero-Downtime Deploy: additive upload → atomic HTML swap → invalidate → cleanup
      # -----------------------------------------------------------------------

      - name: "Phase 1 + 2: Upload assets, then HTML pages"
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          # Phase 1 uploads every non-HTML file (additive, no delete); phase 2
          # uploads the prerendered pages only once phase 1 fully succeeded.
          # Keys, Content-Type and Cache-Control come from plan.mjs; see
          # infrastructure/doc.md, "Key mapping".
          bash artifact/scripts/deploy/upload.sh "$BUCKET" artifact/dist

      - name: "Phase 3: Invalidate CloudFront and wait"
        run: |
          DIST_ID="${{ steps.tf.outputs.distribution_id }}"

          echo "🔄 Creating CloudFront invalidation..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "   Invalidation ID: $INVALIDATION_ID"
          echo "⏳ Waiting for invalidation to complete..."

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INVALIDATION_ID"

          echo "✅ Phase 3 complete — CloudFront cache invalidated and propagated"

      - name: "Phase 4: Cleanup orphaned files"
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: |
          # Deletes every bucket key missing from the build's keys.txt.
          # Never deletes index.html, and refuses a key list without it.
          bash artifact/scripts/deploy/cleanup.sh "$BUCKET" artifact/keys.txt

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "✅ PROD deployment complete (zero-downtime)"
          echo "   Bucket : ${{ steps.tf.outputs.bucket }}"
          echo "   CF Dist: ${{ steps.tf.outputs.distribution_id }}"
          echo "   Domain : www.hagroup.lv"
          echo "   Commit : ${{ github.sha }}"
          echo "=============================================="
