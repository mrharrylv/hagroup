name: Iepakojumi - Build & Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - iepakojumi/service/frontend/**
      - .github/workflows/iepakojumi-deploy.yaml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  NODE_VERSION: "20"
  FRONTEND_DIR: iepakojumi/service/frontend

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    # The existing HA Group Firebase web configuration is stored in the prod
    # GitHub Environment and is shared by both website environments.
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Production build
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iepakojumi-frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist
          retention-days: 7

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    concurrency:
      group: iepakojumi-frontend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
      cancel-in-progress: false

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: iepakojumi-frontend-dist
          path: artifact/dist

      - name: Resolve environment
        id: target
        env:
          DISPATCH_ENV: ${{ inputs.environment }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="$DISPATCH_ENV"
          fi

          echo "environment=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "bucket=${TARGET_ENV}-hagroup-iepakojumi-website" >> "$GITHUB_OUTPUT"

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::561341419749:role/github-oidc-hagroup-${{ steps.target.outputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFront distribution
        id: cloudfront
        env:
          TARGET_ENV: ${{ steps.target.outputs.environment }}
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${TARGET_ENV} - hagroup iepakojumi website'].Id | [0]" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ] || [ "$DISTRIBUTION_ID" = "null" ]; then
            echo "Iepakojumi CloudFront distribution not found. Run the Iepakojumi infrastructure workflow first."
            exit 1
          fi

          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Upload versioned assets
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          aws s3 sync artifact/dist/ "s3://$BUCKET" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Publish HTML entry point
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          aws s3 cp artifact/dist/index.html "s3://$BUCKET/index.html" \
            --content-type "text/html" \
            --cache-control "public, max-age=60, s-maxage=300"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.cloudfront.outputs.distribution_id }}
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Remove superseded assets
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          aws s3 sync artifact/dist/ "s3://$BUCKET" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deployment summary
        run: |
          echo "Environment: ${{ steps.target.outputs.environment }}"
          echo "Bucket: ${{ steps.target.outputs.bucket }}"
          echo "CloudFront: ${{ steps.cloudfront.outputs.distribution_id }}"
