name: IEPAKO - Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: iepako-infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_WORKING_DIR: iepako/infrastructure/terraform

jobs:
  plan-apply:
    name: Plan and apply ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::561341419749:role/github-oidc-hagroup-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check formatting
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Initialize isolated state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform init
          -backend-config="key=hagroup/iepako/${{ inputs.environment }}/terraform.tfstate"

      - name: Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform plan
          -var-file="environments/${{ inputs.environment }}.tfvars"
          -input=false
          -out=tfplan

      - name: Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show endpoints and required DNS records
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform output website_url
          terraform output custom_domain_phase
          terraform output dns_records_required
          terraform output cost_allocation_tags
