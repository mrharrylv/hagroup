<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!--
      Resolve the theme and the language before the first paint.

      Theme: `class="dark"` used to be hardcoded here while ThemeProvider
      applied the real theme after React mounted, so every light-mode visitor
      got a black flash on every cold load. This runs before the body exists,
      so there is nothing to flash, and ThemeProvider only reads the class.

      Language: it is part of the URL (/lv/..., /ru/..., English at the root).
      A visitor who picked Latvian or Russian before, and now comes to the
      bare home URL from outside the site (typed, a bookmark, another site),
      is moved to /lv or /ru with history.replaceState before the app boots.
      Any other URL is shown in the language it is in: a deep link, a link
      opened from this site (the switcher's EN link in a new tab carries this
      site as its referrer, under the default Referrer-Policy), a reload and
      Back. Crawlers have no storage and get the URL's own content, the same
      as every first-time visitor. #root is hidden while the app replaces the
      English markup, at most 3 s. <html lang> follows the final URL
      (WCAG 3.1.1).

      Inline on purpose: an external file would be a second round-trip, and
      the flash is exactly as long as that trip.
    -->
    <style>
      html.reroute-hide #root { visibility: hidden; }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('cloudie-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.classList.add(t);
        } catch (e) {
          // Storage blocked (private mode, or site data disabled). The default
          // stylesheet is the light one, which is the safer thing to flash.
          root.classList.add('light');
        }

        // One URL per page: /services/devops/ becomes /services/devops, the
        // form every canonical, sitemap entry and link uses.
        var path = location.pathname;
        if (path.length > 1 && path.charAt(path.length - 1) === '/') {
          path = path.replace(/\/+$/, '') || '/';
          history.replaceState(history.state, '', path + location.search + location.hash);
        }

        var match = /^\/(lv|ru)(?=\/|$)/.exec(path);
        var lang = match ? match[1] : 'en';
        if (path === '/') {
          try {
            var fromThisSite = document.referrer.indexOf(location.origin + '/') === 0;
            var entry = performance.getEntriesByType('navigation')[0];
            var reopened = entry && (entry.type === 'reload' || entry.type === 'back_forward');
            var saved = localStorage.getItem('cloudie-lang');
            if (!fromThisSite && !reopened && (saved === 'lv' || saved === 'ru')) {
              history.replaceState(history.state, '', '/' + saved + location.search + location.hash);
              lang = saved;
              root.classList.add('reroute-hide');
              setTimeout(function () { root.classList.remove('reroute-hide'); }, 3000);
            }
          } catch (e) {
            // Storage blocked, or no Navigation Timing: stay on the URL as opened.
          }
        }
        root.lang = lang;
      })();
    </script>
    <!--
      Search and share images live at the site root, generated by
      `npm run images` from brand-source/. They are opaque on purpose: the
      /brand/* artwork is white on transparent and vanishes on Google's white
      result page. Keep these URLs stable; Google refetches a favicon URL, it
      does not go looking for a new one.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <!--
      Everything between the seo-head markers is replaced per page at build
      time by scripts/prerender.mjs (title, description, robots, canonical,
      hreflang, Open Graph, Twitter and JSON-LD; see src/seo/). In the browser
      the Seo component updates the same data-seo tags in place.
    -->
    <!--seo-head-->
    <title data-seo="title">HA Group</title>
    <!--/seo-head-->
    <!--
      This file is also what CloudFront answers for a URL that has no page of
      its own (an unknown path, or a trailing-slash URL): the English home.
      main.tsx throws that markup away and renders the right page, and this
      keeps it from being seen meanwhile. The canonical says which URL the
      markup was rendered for; the dev server's index.html has none.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var canonical = document.querySelector('link[data-seo="canonical"]');
        if (!canonical || root.classList.contains('reroute-hide')) return;
        if (new URL(canonical.href).pathname !== location.pathname) {
          root.classList.add('reroute-hide');
          setTimeout(function () { root.classList.remove('reroute-hide'); }, 3000);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script defer src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
